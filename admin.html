<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Carga | Arcade LevelUp</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contenedor-admin { max-width: 550px; margin: 50px auto; padding: 35px; background: var(--tarjeta-base); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); border: 1px solid rgba(255,255,255,0.05); }
        .grupo-campo { margin-bottom: 22px; }
        .grupo-campo label { display: block; font-family: var(--fuente-gaming); color: var(--neon-magenta); font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
        .grupo-campo input { width: 100%; padding: 14px; background: #070b14; border: 1px solid rgba(255,255,255,0.08); color: var(--texto-brillante); font-family: var(--fuente-base); font-size: 0.95rem; transition: border-color 0.3s; }
        .grupo-campo input:focus { border-color: var(--neon-cian); outline: none; }
        .btn-subir { width: 100%; font-family: var(--fuente-gaming); background: var(--neon-magenta); color: white; padding: 16px; font-weight: 700; border: none; letter-spacing: 2px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .btn-subir:hover { background: white; color: var(--fondo-oscuro); box-shadow: 0 4px 25px rgba(255,255,255,0.5); }
        .consola-estado { text-align: center; margin-top: 15px; font-family: var(--fuente-gaming); color: var(--neon-cian); display: none; font-size: 0.9rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="lineas-grid"></div>

    <div class="contenedor-admin">
        <header style="text-align: center; margin-bottom: 35px;">
            <h1 style="font-family: var(--fuente-gaming); font-size: 2rem; letter-spacing: -1px;">TERMINAL DE <span class="texto-neon">CARGA</span></h1>
            <p style="color: var(--texto-mutado); font-size: 0.9rem; margin-top: 5px;">Sube capturas y enlaces directo al catálogo público</p>
        </header>

        <div id="lista-juegos-admin" style="margin-bottom: 20px;"></div>

        <form id="form-admin">
            <div class="grupo-campo">
                <label>Nombre del Videojuego</label>
                <input type="text" id="titulo" required placeholder="Ej: Cyber Dash 2026">
            </div>
            <div class="grupo-campo">
                <label>Etiqueta / Desarrollador</label>
                <input type="text" id="badge" required placeholder="Ej: GRUPO A o ALUMNO: MATEO">
            </div>
            <div class="grupo-campo">
                <label>URL de Vercel del Juego</label>
                <input type="url" id="urlJuego" required placeholder="https://vercel.app">
            </div>
            <div class="grupo-campo">
                <label>Captura de Pantalla Horizontal (16:9)</label>
                <input type="file" id="imagen" accept="image/*" style="border: none; padding: 10px 0;">
            </div>
            <div style="display:flex; gap:10px;">
                <button type="submit" id="btn-enviar" class="btn-subir" style="flex:1;">COMPILAR Y PUBLICAR</button>
                <button type="button" id="btn-cancelar" style="flex:0 0 auto; background:#334155; color:white; border:none; padding:12px 18px; cursor:pointer;">CANCELAR</button>
            </div>
            <div id="consola" class="consola-estado">ENVIANDO PAQUETES DE DATOS AL INICIO...</div>
        </form>
    </div>

    <script>
        let editingId = null;

        async function cargarJuegosAdmin() {
            const cont = document.getElementById('lista-juegos-admin');
            cont.innerHTML = '<p style="color:var(--texto-mutado); font-family:var(--fuente-gaming)">Cargando juegos...</p>';
            try {
                const res = await fetch(`/data/juegos.json?t=${Date.now()}`);
                const juegos = await res.json();
                if (!juegos || juegos.length === 0) { cont.innerHTML = '<p style="color:var(--texto-mutado);">No hay juegos registrados.</p>'; return; }
                cont.innerHTML = '';
                juegos.forEach(j => {
                    const row = document.createElement('div');
                    row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.marginBottom = '10px';
                    row.innerHTML = `
                        <img src="${j.urlImagen}" alt="${j.titulo}" style="width:84px; height:47px; object-fit:cover; margin-right:12px; border:1px solid rgba(255,255,255,0.04)">
                        <div style="flex:1">
                            <div style="font-family:var(--fuente-gaming); color:var(--neon-magenta); font-size:0.8rem">${j.badge}</div>
                            <div style="font-weight:700">${j.titulo}</div>
                        </div>
                        <div style="display:flex; gap:8px">
                            <button data-id="${j.id}" class="btn-editar" style="background:#06b6d4; border:none; color:#042028; padding:8px 10px; cursor:pointer">Editar</button>
                            <button data-id="${j.id}" class="btn-eliminar" style="background:#ff0066; border:none; color:white; padding:8px 10px; cursor:pointer">Eliminar</button>
                        </div>
                    `;
                    cont.appendChild(row);
                });

                // Attach events
                document.querySelectorAll('.btn-editar').forEach(b => b.addEventListener('click', async (ev) => {
                    const id = ev.currentTarget.getAttribute('data-id');
                    const juego = juegos.find(x => String(x.id) === String(id));
                    if (!juego) return;
                    document.getElementById('titulo').value = juego.titulo;
                    document.getElementById('badge').value = juego.badge;
                    document.getElementById('urlJuego').value = juego.urlJuego;
                    editingId = juego.id;
                    document.getElementById('btn-enviar').innerText = 'GUARDAR CAMBIOS';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }));

                document.querySelectorAll('.btn-eliminar').forEach(b => b.addEventListener('click', async (ev) => {
                    const id = ev.currentTarget.getAttribute('data-id');
                    if (!confirm('¿Eliminar este juego?')) return;
                    const resp = await fetch(`${window.location.origin}/api/guardar-juego`, {
                        method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
                    });
                    if (resp.ok) { cargarJuegosAdmin(); } else { alert('Error eliminando'); }
                }));

            } catch (e) { cont.innerHTML = '<p style="color:var(--neon-magenta);">No se pudo cargar la lista.</p>'; }
        }

        document.getElementById('form-admin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const consola = document.getElementById('consola');
            consola.style.display = 'block';
            consola.innerText = "PROCESANDO IMAGEN EN ALTA RESOLUCIÓN...";
            const archivo = document.getElementById('imagen').files[0];
            
            // Transformar la captura de pantalla a Base64 para poder mandarla a la API de Vercel
            const reader = new FileReader();
            // Si el usuario no seleccionó archivo, leemos sin imagen
            if (archivo) {
                reader.readAsDataURL(archivo);
                reader.onloadend = async () => { await enviarFormulario(reader.result, archivo.name); };
            } else {
                await enviarFormulario(null, null);
            }
        });

        document.getElementById('btn-cancelar').addEventListener('click', () => {
            editingId = null; document.getElementById('form-admin').reset(); document.getElementById('btn-enviar').innerText = 'COMPILAR Y PUBLICAR';
        });

        async function enviarFormulario(imagenBase64, nombreImagen) {
            const consola = document.getElementById('consola');
            try {
                const paqueteBase = {
                    titulo: document.getElementById('titulo').value,
                    badge: document.getElementById('badge').value,
                    urlJuego: document.getElementById('urlJuego').value
                };

                const endpoint = `${window.location.origin}/api/guardar-juego`;

                let respuesta, resultado = {};

                if (editingId) {
                    const body = Object.assign({ id: editingId }, paqueteBase);
                    if (imagenBase64) { body.imagenBase64 = imagenBase64; body.nombreImagen = nombreImagen; }
                    respuesta = await fetch(endpoint, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    try { resultado = await respuesta.json(); } catch (e) {}
                    if (respuesta.ok) {
                        consola.innerText = '¡JUEGO ACTUALIZADO!';
                        editingId = null; document.getElementById('btn-enviar').innerText = 'COMPILAR Y PUBLICAR';
                        document.getElementById('form-admin').reset(); cargarJuegosAdmin();
                        setTimeout(()=>{ window.location.href = '/'; }, 800);
                    } else {
                        consola.innerText = `ERROR: ${resultado.error || respuesta.statusText}`;
                    }
                } else {
                    const body = Object.assign({}, paqueteBase);
                    if (imagenBase64) { body.imagenBase64 = imagenBase64; body.nombreImagen = nombreImagen; }
                    respuesta = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    try { resultado = await respuesta.json(); } catch (e) {}
                    if (respuesta.ok) {
                        consola.innerText = '¡SISTEMA ACTUALIZADO! REDIRECCIONANDO...';
                        if (resultado && resultado.juego) {
                            try { sessionStorage.setItem('ultimoJuego', JSON.stringify(resultado.juego)); } catch (e) {}
                        }
                        document.getElementById('form-admin').reset(); cargarJuegosAdmin();
                        setTimeout(()=>{ window.location.href = '/'; }, 1200);
                    } else {
                        consola.innerText = `ERROR: ${resultado.error || respuesta.statusText}`;
                    }
                }
            } catch (err) {
                consola.innerText = `FALLO DE CONEXIÓN: ${err.message}`;
                console.error('Error enviando formulario', err);
            }
        }

        // Cargar lista al abrir admin
        cargarJuegosAdmin();
    </script>
</body>
</html>
